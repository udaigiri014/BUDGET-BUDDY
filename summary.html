<!DOCTYPE html>
<html>
<head>
    <title>Summary</title>
    <style>
        body { 
            font-family: verdana, Geneva, Tahoma, sans-serif;
            text-align: center; 
            margin-top: 50px;
            text-align: center; 
            margin-top: 50px;
            background-color: rgb(0, 0, 0);
            color: white 
        }
        h2 { 
            margin-bottom: 30px; 
        }
        p { 
            font-size: 20px;
            margin: 10px; 
        }
        .home{
            margin-top: 10px;
            border-radius: 5px;
            border: 0px;
            transform: scale(1.7);
            cursor: pointer;
            padding-bottom: 3px;
            color: white;
            background-color: black;
            transition: background-color 0.3s;
        }
        .home:hover{
            background-color: rgb(30, 215, 96);
            color: black;
        }
    </style>
</head>
<body>
    <h2>Finance Summary</h2>
    <p>Total Income: ₹{{ income }}</p>
    <p>Total Expense: ₹{{ expense }}</p>
    <p>Net Balance: ₹{{ balance }}</p>
    <a href="{{url_for('Menu')}}"><button class="home">🏠︎</button></a>
</body>
</html>
