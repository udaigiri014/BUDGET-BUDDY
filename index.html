<!DOCTYPE html>
<html>
<head>
    <title>Personal Finance Tracker</title>
    <style>
        body {

            margin-top: 50px;
            background-color: rgb(0, 0, 0);
            color: white;
        }
        button{
            font-family: verdana, Geneva, Tahoma, sans-serif;

        .menubox{
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            max-width: 550px;
            margin: 80px auto 0 auto;
            margin-top: 150px;
            gap:  60px 180px;
            text-align: center;
        }
        .box{
            border-radius: 14px;
            transform: scale(2);
            cursor: pointer;
            width: 164px;
            transition: background-color 0.3s;
            height: 30px;
            border-width: px;
            border-style: solid;
            border-color: rgb(52, 50, 44);
            border-width: 2px;
            box-shadow: 3px 2px 0px rgb(52, 50, 44) ;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        }
            
        .box:hover{
            background-color: rgb(30, 215, 96);
        }
       
        .logout{
            color: rgb(30, 215, 96);
            margin-top: 30px;
            text-align: right;
        }
        .welcome2{
        margin-top: 100px;
       font-family:'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
       }
        h2{ font-family: Verdana, Geneva, Tahoma, sans-serif;
        }
        .logo{
            width: 45px;
            margin-bottom: 10px;
            display: inline;
        }
        
        
        
    </style>
</head>
<body>
    <div class="welcome2">

    </div>
    
    <div class="menubox">

        <div  id="b4"><a href="/login"><button class="box">Login out</button></a></div>
        
        
    </div>
