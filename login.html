<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login</title>
    <style>
        body{
            font-family: Verdana, Geneva, Tahoma, sans-serif; 
            background-color: rgb(0, 0, 0);
            color: white;
            padding-top: 70px;
        }
        .container{

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transform: scale(1.2);
        }
        .logo{
            width: 45px;
        }
        p{
            margin-top: 10px;
            margin-bottom: 3px;
        }
        .welcome{
            font-size: 22px;
            font-weight: 100px;
            font-family: Verdana, Geneva, Tahoma, sans-serif; 
        }
        .login{
            width: 174px;
            height: 44px;
            border-radius: 30px;
            margin-top: 20px;
            margin-bottom: 10px;
            padding-top: 4px;
            border-style: solid;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif; 
            transition: background-color 0.3s
            
        }
        .login:hover{
            background-color: rgb(30, 215, 96);
        }

        .box{
            padding :4px 8px;
            height: auto;
            line-height: normal;
            background-color: transparent;
            border-style: solid;
            color: white;
        }
        .box:hover{
            border-color: white;  
            
        }   
        .warning{
            color: #c91123 ; 
            align-items: left;
            font-size: 12px
        }   
        a{
            align-items: center;
            
        } 
        
        
    </style>
</head>
<body>
    <div class="container">
        <img class="logo" src="{{ url_for('static', filename='piggy.jpg') }}"> 
        <h1 class="welcome">Welcome Back</h1>
      <div class="login-box">
        <form method="POST">
            
             <p>Username</p>
             <input class="box" type="text" placeholder="username" name="username" required>
             <p>Password</p>
             <input class="box" type="password" placeholder="password" name="password" required>
             <p class="warning">{{invaild}}</p>
            
            <button type="submit" class="login">Login</button>
        </form>
        <p>Don't have an account?</p>
        <a href="/signup" style="color: rgb(30, 215, 96);" >Sign up</a>
       
         
    </div>
</body>
</html>
